# KILN_Camera's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Fluidd (Settings > Software Updates). After an update,
# RESTART Klipper; if CAMERA_STATUS then says the hook is outdated, run
# install.sh again as root.
[update_manager kiln-camera]
type: git_repo
path: /data/ad5x/plugins/camera
origin: https://github.com/DIEHARDave/KILN_Camera.git
primary_branch: main
is_system_service: False
managed_services: klipper
