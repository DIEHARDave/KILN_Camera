# KILN_Camera: zMod's camera macro names on Kiln's own camera service
# (S64ad5x-camera: ustreamer, the camera's MJPEG passed through,
# /webcam/ /webcam2/), plus hotplug. The macros only save camera_*
# variables; the root hook (install.sh, once) applies them and restarts
# the cameras within about 6 s. See README.md.
#
#   CAMERA_ON                              on, last settings
#   CAMERA_ON WIDTH=1920 HEIGHT=1080 FPS=15
#   CAMERA_OFF
#   CAMERA_RESTART
#   CAMERA_STATUS                          hook, cameras, streams
# zMod's VIDEO=, STREAMER=, FORMAT=, FS= are accepted and ignored: every
# UVC camera is streamed, as MJPEG by ustreamer.
# Defaults (no setting saved): 1280x720 at 15 fps.

[kiln_camera]

[gcode_macro CAMERA_ON]
description: Turn the camera(s) on; WIDTH= HEIGHT= FPS= are kept
gcode:
  {% if params.WIDTH is defined or params.HEIGHT is defined %}
    {% set w = params.WIDTH|default(1280)|int %}
    {% set h = params.HEIGHT|default(720)|int %}
    {% if w < 160 or h < 120 or w > 4096 or h > 4096 %}
      {action_raise_error("CAMERA_ON: WIDTH/HEIGHT out of range")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=camera_resolution VALUE="'{w}x{h}'"
  {% endif %}
  {% if params.FPS is defined %}
    {% set fps = params.FPS|int %}
    {% if fps < 1 or fps > 60 %}
      {action_raise_error("CAMERA_ON: FPS must be 1..60")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=camera_fps VALUE={fps}
  {% endif %}
  SAVE_VARIABLE VARIABLE=camera_on VALUE=1
  _CAMERA_BUMP
  _CAMERA_CHECK
  RESPOND MSG="Camera on, starting within a few seconds"

[gcode_macro CAMERA_OFF]
description: Turn the camera(s) off (kept across reboots)
gcode:
  SAVE_VARIABLE VARIABLE=camera_on VALUE=0
  _CAMERA_CHECK
  RESPOND MSG="Camera off within a few seconds"

[gcode_macro CAMERA_RESTART]
description: Restart the camera(s) with the saved settings
gcode:
  _CAMERA_BUMP
  _CAMERA_CHECK
  RESPOND MSG="Camera restarting within a few seconds"

[gcode_macro _CAMERA_BUMP]
gcode:
  {% set n = printer.save_variables.variables.camera_restart|default(0)|int %}
  SAVE_VARIABLE VARIABLE=camera_restart VALUE={(n + 1) % 1000}

# Nothing acts on the variables without the root hook: say so
[gcode_macro _CAMERA_CHECK]
gcode:
  {% for p in printer.kiln_camera.problems %}
    RESPOND TYPE=error MSG="KILN_Camera: {p}"
  {% endfor %}
